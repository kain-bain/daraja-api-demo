<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay with M-Pesa</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="container">

    <!-- Payment view -->
    <section id="payView" class="card">

      <div class="toolbar">
        <h1>Pay with M-Pesa</h1>
        <button id="showOrders" class="link-button" type="button">Orders →</button>
      </div>
      <p class="subtitle">Enter your details to receive an STK Push.</p>

      <form id="paymentForm">

        <label for="phone">M-Pesa Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="0712345678"
          required
        >

        <label for="amount">Amount (KES)</label>
        <input
          type="number"
          id="amount"
          min="1"
          placeholder="1"
          required
        >

        <button type="submit" id="payButton">
          Pay with M-Pesa
        </button>

      </form>

      <div id="status" class="status hidden"></div>

    </section>

    <!-- Orders view -->
    <section id="ordersView" class="card hidden">

      <div class="toolbar">
        <h1>Orders</h1>
        <button id="showPay" class="link-button" type="button">← New payment</button>
      </div>

      <button id="refreshOrders" class="small-button" type="button">Refresh</button>

      <ul id="ordersList" class="orders-list"></ul>
      <div id="ordersEmpty" class="empty hidden">No orders yet.</div>

    </section>

  </main>

  <script src="/app.js"></script>

</body>
</html>
